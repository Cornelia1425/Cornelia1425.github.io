<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#e9dcc1">
 <meta name="description" content="A quiet journey through a living ink painting. Walk left, cross the streams, and follow the mountains.">
 <title>Beyond the Mountains</title>
 <link rel="icon" type="image/svg+xml" href="./favicon.svg">
 <link rel="preload" as="image" href="./assets/huangshan-ink-v2.png">
 <link rel="prefetch" as="image" href="./assets/huizhou-village-v4.png">
 <link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./ink.css">
</head>
<body>
 <main class="scroll-shell">
  <div class="scroll-mount">
   <section id="stage" class="stage" tabindex="0" aria-label="An ink painting you can explore. Walk left with the arrow keys; press Space to jump.">
    <svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
    <div class="paper-overlay" aria-hidden="true"></div>
   </section>
  </div>
  <div class="outside-rail">
   <p id="hint" class="quiet-hint" role="status"></p>
   <div id="actions" class="quiet-actions" hidden>
    <button id="advance" type="button"></button>
    <button id="retry" type="button" hidden></button>
   </div>
   <div id="touchControls" class="touch-controls" aria-label="Touch controls">
    <div class="walk-controls">
     <button type="button" data-control="left" aria-label="Walk left"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M26 16H6m8-7-8 7 8 7"/></svg></button>
     <button type="button" data-control="right" aria-label="Walk right"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 16h20m-8-7 8 7-8 7"/></svg></button>
    </div>
    <button type="button" data-control="jump" aria-label="Jump"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 26V6m-7 8 7-8 7 8"/></svg></button>
   </div>
  </div>
 </main>
 <div class="preferences">
 <button id="sound" class="sound-switch" type="button" aria-pressed="false">Sound off</button>
 <button id="colorToggle" class="color-switch" type="button" aria-pressed="true">Color on</button>
 <nav class="language-switch" aria-label="Language">
  <button type="button" data-language="en" lang="en" aria-label="English" aria-pressed="true">EN</button>
  <span aria-hidden="true">/</span>
  <button type="button" data-language="zh" lang="zh-CN" aria-label="中文" aria-pressed="false">中文</button>
 </nav>
 </div>
 <div id="srStatus" class="sr-only" role="status" aria-live="polite"></div>
 <script type="module" src="./app.js"></script>
</body>
</html>
